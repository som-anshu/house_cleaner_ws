# burger_bridge.yaml — ros_gz_bridge config for the house_cleaner Gazebo stack.
#
# Same as turtlebot3_gazebo/params/turtlebot3_burger_bridge.yaml EXCEPT cmd_vel:
# the stock config maps cmd_vel as geometry_msgs/TwistStamped, which Nav2
# cannot produce (controller_server outputs plain geometry_msgs/Twist).
# The gz side (DiffDrive plugin) consumes gz.msgs.Twist either way, so plain
# Twist is the correct bridge type here.

# gz topic published by the simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# gz topic published by JointState plugin
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin
#
# This is the ONLY source of the odom -> base_footprint transform.
#
# NOTE ON ODOMETRY DRIFT (measured, not assumed):
# Earlier in this session the ROS-side /odom reported values tens of metres
# outside the 5.05 x 6.15 m room, and slam_toolbox compensated with huge
# map -> odom corrections. Inspection of the GAZEBO-side /odom now shows the
# plugin's own pose sitting at ~(0, 0) and NOT drifting, so the runaway values
# seen on the ROS side were not the plugin integrating freely. The transforms
# are therefore kept bridged (below) but the odometry quality is treated as an
# open item rather than "fixed" -- see CONTEXT.md for the measurements.
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# gz topic published by DiffDrive plugin
#
# Supplies odom -> base_footprint on /tf. Without this entry the TF tree has no
# odom -> base_footprint link at all, so slam_toolbox and RViz drop EVERY scan
# with:
#   "Message Filter dropping message: frame 'base_scan' ... queue is full"
# and no map is ever produced. Verified by observation.
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# gz topic subscribed to by DiffDrive plugin — plain Twist so Nav2 can drive
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# gz topic published by IMU plugin
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# gz topic published by Sensors plugin
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
