services:
  cleaner:
    image: house_cleaner:jazzy
    build:
      context: .
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
      - GZ_RENDERING_DISABLED=1
      - QT_QPA_PLATFORM=offscreen
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
    devices:
      - /dev/dri
    # For GUI mode, set DISPLAY=:0 and use "headless:=false" in entrypoint
    # For headless mode (default), do NOT set DISPLAY
    # command is empty — entrypoint.sh handles launch directly.