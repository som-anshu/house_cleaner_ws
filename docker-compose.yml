services:
  cleaner:
    image: house_cleaner:jazzy
    build:
      context: .
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
    command: ros2 launch house_cleaner_bringup house_cleaning_auto.launch.py
    # ponytail: single service; add a second "dev" service (bash entry) if an
    # interactive shell inside the same container is needed later