services:
  cleaner:
    image: house_cleaner:jazzy
    build:
      context: .
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
    volumes:
      - /dev/shm:/dev/shm
    # For GUI mode, additional options are needed:
    # -e DISPLAY=$DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix:rw --device /dev/dri
    # Use ./run_docker.sh instead which handles all GUI setup automatically.
    # command is empty — entrypoint.sh handles launch directly.
