# =============================================================================
# docker-compose.yml - House Cleaner Robot Docker Compose Configuration
# =============================================================================
# Runs the house cleaner robot via the same run_docker.sh primitives:
# X11 + Wayland GUI forwarding, /dev/dri GPU passthrough, software-rendering
# fallback, and the Foxglove web bridge on :8765.
#
# Usage:
#   docker compose up --build        # full stack, GUI
#   docker compose run --rm house_cleaner --headless
#   docker compose down
#
# GUI forwarding requires DISPLAY/WAYLAND_DISPLAY AND (for X11) the xauth
# cookie.  Use run_docker.sh for a fully auto-configured single command;
# this compose file is the explicit, inspectable equivalent.
# =============================================================================

services:
  house_cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    image: house_cleaner:jazzy
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true

    # --- GUI Rendering Configuration (X11 + Wayland) ---
    environment:
      # X11 forwarding (Gazebo GUI, RViz2)
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
      # Wayland forwarding (when host session is Wayland)
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/1000}
      # Software rendering fallback; set LIBGL_ALWAYS_SOFTWARE=0 to use a GPU
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
      - MESA_GL_VERSION_OVERRIDE=3.3
      - QT_X11_NO_MITSHM=1
      # ROS2 configuration
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30

    # --- Volume Mounts ---
    volumes:
      # X11 socket (required for Gazebo GUI, RViz2)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Wayland socket (required when host session is Wayland)
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}:rw
      # GPU /dev/dri when present on host (otherwise software rendering)
      - /dev/dri:/dev/dri:rw
      # Shared memory for Gazebo (prevents crashes)
      - /dev/shm:/dev/shm
      # Live source tree (edits reflect immediately via symlink-install)
      - ./src:/workspace/src:rw

    # --- Network Configuration ---
    # Foxglove bridge runs on port 8765 for web visualization
    ports:
      - "8765:8765"

    # --- Resource Limits ---
    # Increase shared memory for Gazebo
    shm_size: '2gb'

    # --- Misc ---
    restart: unless-stopped