services:
  cleaner:
    image: house_cleaner:jazzy
    build:
      context: .
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
      # Headless rendering (no display needed, no X11 forwarding)
      - DISPLAY=
      - GZ_RENDERING_DISABLED=1
      - QT_QPA_PLATFORM=offscreen
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
      - MESA_GLSL_VERSION_OVERRIDE=330
    volumes:
      - /dev/shm:/dev/shm
    # For GUI mode, run with ./run_docker_gui.sh instead (sets DISPLAY, mounts X11 socket)
    # command is empty — entrypoint.sh handles launch directly.