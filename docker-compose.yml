services:
  cleaner:
    image: house_cleaner:jazzy
    build:
      context: .
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
      - DISPLAY=${DISPLAY:-:0}
    # X11 + GPU for the Gazebo GUI (launched by entrypoint, not headless)
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
    devices:
      - /dev/dri
    command: ["/entrypoint.sh"]