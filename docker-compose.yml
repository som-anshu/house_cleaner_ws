services:
  cleaner:
    image: house_cleaner:jazzy
    build:
      context: .
    container_name: house_cleaner_jazzy
    stdin_open: true
    tty: true
    environment:
      - TURTLEBOT3_MODEL=burger
      - ROS_DOMAIN_ID=30
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - .:/workspace
    devices:
      - /dev/dri
    # command is empty — entrypoint.sh handles launch directly.
